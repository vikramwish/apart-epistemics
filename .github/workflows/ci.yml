name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,paper]"
      - run: make check PYTHON=python
      - run: make paper-audit PYTHON=python
      - name: Check wheel packaging
        run: python -m pip wheel . --no-deps --wheel-dir dist

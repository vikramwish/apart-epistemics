name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  react-explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-explorer-browser-results
          path: frontend/test-results/

  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium for E2E checks
        run: python -m playwright install --with-deps chromium

      - name: Run Ruff lint and format checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit, integration, and Playwright E2E suite with coverage
        run: pytest --cov=apart_epistemics --cov-report=term-missing -v

      - name: Exercise teammate smoke workflow
        run: make smoke CLI=apart-epistemics

      - name: Verify wheel installation outside the source tree
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/epistemics-wheel
          /tmp/epistemics-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/epistemics-wheel/bin/apart-epistemics setup --out wheel-suite.yaml --agents 8 --rounds 2 --tasks 2
          /tmp/epistemics-wheel/bin/apart-epistemics demo --config wheel-suite.yaml --out wheel-results --site wheel-site

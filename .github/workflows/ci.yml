name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium for E2E checks
        run: python -m playwright install --with-deps chromium

      - name: Run Ruff lint and format checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit, integration, and Playwright E2E suite with coverage
        run: pytest --cov=apart_epistemics --cov-report=term-missing -v

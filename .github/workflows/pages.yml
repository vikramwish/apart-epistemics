name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = 200 ] && [ "$(jq -r '.build_type' pages.json)" = workflow ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ] || [ "$status" = 200 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Pages is not configured for GitHub Actions. A repository admin must enable it in Settings > Pages.'
            {
              echo '### Pages setup required'
              echo 'Deployment was skipped; the separate CI workflow still validates the application.'
              echo "A repository admin must open https://github.com/$GITHUB_REPOSITORY/settings/pages and select **GitHub Actions** as the build source."
              echo 'Then run this workflow again using Run workflow. No code changes are needed.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not check Pages configuration (HTTP $status)."
            exit 1
          fi

  deploy:
    needs: pages-configuration
    if: needs.pages-configuration.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test React explorer
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload static explorer bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apart-epistemics"
version = "0.1.0"
description = "Epistemic Prism: Multi-agent simulation and testing suite for AI-mediated epistemic diversity, topic coverage, and calibration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vikram Viswanath", email = "svikramvish@gmail.com" }]
dependencies = [
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "playwright>=1.48",
]

[project.scripts]
apart-epistemics = "apart_epistemics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apart_epistemics = ["templates/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "e2e: Browser end-to-end tests requiring Playwright Chromium.",
]

[tool.coverage.run]
branch = true
source = ["apart_epistemics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PT", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 16
